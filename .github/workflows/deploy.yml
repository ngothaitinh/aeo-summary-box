name: Deploy Plugin to tpiland.com

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via Webhook
    runs-on: ubuntu-latest

    steps:
      - name: Call deploy webhook on server
        run: |
          HTTP_CODE=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            "https://tpiland.com/deploy-webhook.php")
          cat /tmp/deploy_response.txt
          echo ""
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deploy failed with HTTP $HTTP_CODE"
            exit 1
          fi
