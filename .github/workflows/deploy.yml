name: Deploy Plugin to tpiland.com

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Trigger cPanel Git Pull
    runs-on: ubuntu-latest

    steps:
      - name: Trigger cPanel to pull latest code
        run: |
          HTTP_CODE=$(curl -s -o /tmp/cpanel_response.txt -w "%{http_code}" \
            -H "Authorization: cpanel tpilandc:${{ secrets.CPANEL_TOKEN }}" \
            "https://tpiland.com:2083/execute/VersionControl/update?repository_root=%2Fhome%2Ftpilandc%2Frepos%2Faeo-summary-box")
          cat /tmp/cpanel_response.txt
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deploy failed with HTTP $HTTP_CODE"
            exit 1
          fi
