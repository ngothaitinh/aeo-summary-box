name: Deploy Plugin to tpiland.com

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: 103.77.162.22
          port: 22
          username: tpilandc
          password: ${{ secrets.CPANEL_PASSWORD }}
          local_path: ./aeo-summary-box/*
          remote_path: /home/tpilandc/public_html/wp-content/plugins/aeo-summary-box/
          sftp_only: true
          delete_remote_files: false
