name: Deploy Plugin to tpiland.com

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 103.77.162.22
          port: 22
          username: tpilandc
          password: ${{ secrets.CPANEL_PASSWORD }}
          source: "aeo-summary-box/"
          target: /home/tpilandc/public_html/wp-content/plugins/aeo-summary-box/
          strip_components: 1
          rm: false
